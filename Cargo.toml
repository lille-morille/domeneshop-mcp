[package]
name = "domeneshop-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "0.16", features = ["server", "transport-streamable-http-server", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
progenitor-client = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures-core = "0.3"
base64 = "0.22"

[build-dependencies]
progenitor = "0.14"
serde_json = "1"
syn = "2"
prettyplease = "0.2"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
single_use_lifetimes = "warn"
variant_size_differences = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Restriction lints (opt-in, very strict)
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
expect_used = "warn"
unwrap_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
str_to_string = "warn"
string_slice = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"
exit = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
integer_division = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
unwrap_in_result = "warn"
wildcard_dependencies = "warn"
# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
# Private binary crate — no need for crates.io metadata
cargo_common_metadata = "allow"
