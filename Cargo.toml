[package]
name = "domeneshop-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "0.16", features = ["server", "transport-streamable-http-server", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
progenitor-client = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures-core = "0.3"
base64 = "0.22"

[build-dependencies]
progenitor = "0.14"
serde_json = "1"
syn = "2"
prettyplease = "0.2"
